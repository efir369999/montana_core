[package]
name = "mt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Montana agent machine (Montana App, An agent): the machine of an agent is a node -- it seals, knocks and opens the letters of its pipes with the very bytes a phone uses, every cipher taken from the cores the phone links."

[dependencies]
mt-crypto = { path = "../mt-crypto" }
mt-messenger-e2e = { path = "../mt-messenger-e2e" }
mt-mnemonic = { path = "../mt-mnemonic" }
mt-names = { path = "../mt-names" }
serde_json = "=1.0.140"
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
hex = "=0.4.3"
